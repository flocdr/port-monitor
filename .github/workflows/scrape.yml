name: Daily Scrape

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC = ~05:00 Colombia time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install

      - run: node src/index.js
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/port_calls.csv index.html
          git diff --staged --quiet && echo "No new data" || \
            git commit -m "chore: snapshot $(date -u +%Y-%m-%d)" && git push
